[build]
  publish = "_site"
  command = "bundle exec jekyll build"

[build.environment]
  JEKYLL_ENV = "production"
  RUBY_VERSION = "3.2.2"

[[plugins]]
  package = "@netlify/plugin-jekyll"

# Serve index.html for any path that doesn't exist
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Ensure _redirects file is included in the build
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = true 